databases:
  - name: agriexpert-db
    plan: free

services:
  - type: web
    name: agriexpert
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn agriexpert_project.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: agriexpert-db
          property: connectionString
